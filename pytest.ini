[pytest]
# Django settings module for the backend application
DJANGO_SETTINGS_MODULE = backend._backend.settings

# Python path configuration - includes frontend, backend, and current directory
# This allows tests to import modules from all parts of the project
# pythonpath = frontend backend .
pythonpath = backend .

# Test file patterns - pytest will discover tests in files matching these patterns
python_files = tests.py test_*.py *_test.py

# Test discovery paths - specifies which directories to search for tests
# testpaths = backend frontend
testpaths = backend

# Additional pytest options
# --create-db: Creates a fresh test database for Django tests
# -p nicegui.testing.user_plugin: Loads the NiceGUI testing plugin for UI component testing
# addopts = --create-db -p nicegui.testing.user_plugin -p env 
addopts = --create-db -p env 

# Asyncio mode configuration
# auto: Automatically detects and handles async test functions
asyncio_mode = auto

# Filter warnings to suppress known Django warnings during testing
filterwarnings =
    ignore::UserWarning:django.core.handlers.base

# Environment variables for test execution
# RUNNING_TESTS=True: Flag to indicate when the application is running in test mode
env = 
    D:RUNNING_TESTS=True
    D:GEMINI_API_KEY="test-api-key"
    D:GEMINI_MODEL_NAME="test-model-name"
    D:APP_STORAGE_SECRET=test
    D:LLM_BATCH_SIZE=5

# NiceGUI testing configuration
# main_file: Specifies the main application file for NiceGUI testing plugin
# This is required for frontend tests that use the NiceGUI testing framework
# main_file = frontend/main.py

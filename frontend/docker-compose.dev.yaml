services:
  client:
    build:
      context: ./frontend
      target: dev

    env_file:
      - .env
      
    # Map the frontend code for hot-reloading (relative to the frontend/ directory)
    volumes:
      - ./frontend:/usr/src/app:delegated
      
    # Command to run NiceGUI dev server
    command: python app.py --host 0.0.0.0 --port 8080 --reload
    
    ports:
      - "8080:8080" # Using 8080 to avoid collision with backend's 8000
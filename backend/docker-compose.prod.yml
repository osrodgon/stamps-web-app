services:
  stamps-backend:
    build:
      dockerfile: Dockerfile.prod
    image: osrogon/stamps-backend
    env_file:
      - .env
    ports:
      - "80:8000"
    # Stamp pictures: the same host folder the frontend serves, mounted
    # read-only here. Adding a picture on the server needs no rebuild.
    volumes:
      - type: bind
        source: /media/data/stamps-docker-data/images
        target: /srv/stamp-images
        read_only: true
    # Run Gunicorn
    command: gunicorn --workers 4 --bind 0.0.0.0:8000 _backend.wsgi:application
    environment:
      DATADESK_STAMP_IMAGES: /srv/stamp-images

    networks:
      - stamps-network

networks:
  stamps-network:
    external: true

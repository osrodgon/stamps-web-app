services:
  stamps-backend:
    build:
      dockerfile: Dockerfile.prod
    image: osrogon/stamps-backend
    env_file:
      - .env
    ports:
      - "80:8000"
    # Run Gunicorn
    command: gunicorn --workers 4 --bind 0.0.0.0:8000 _backend.wsgi:application

    networks:
      - stamps-network

networks:
  stamps-network:
    external: true

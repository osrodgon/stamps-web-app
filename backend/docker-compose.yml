services:
  db:
    image: postgres:14-alpine
    restart: always
    container_name: stamps-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_stamps_data:/var/lib/postgresql/data/
    networks:
      - stamps-network

  stamps-backend:
    build:
      context: .
    container_name: stamps-backend
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: _backend.settings
      SECRET_KEY: 'changeme_in_prod'
    expose:
      - 8000
    networks:
      - stamps-network

volumes:
  postgres_stamps_data:

networks:
  stamps-network:
    external: true
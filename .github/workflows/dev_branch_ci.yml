name: Django + NiceGUI CI on Develop

# Trigger the workflow on pushes and pull requests targeting 'develop'
on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
      
# --- Jobs Definition ---
jobs:
  # 1. Backend CI Job (Django) - UPDATED
  backend_ci:
    name: Django Backend Build & Test (pytest/coverage)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Use your required Python version
          
      - name: Install Dependencies
        working-directory: ./backend
        # Install dependencies from requirements.txt, including pytest and coverage
        run: pip install -r requirements.txt

      # ----------------------------------------------------
      # Code Formatting Check (Black)
      # ----------------------------------------------------
      # - name: Run Black Formatting Check
      #   working-directory: ./backend
      #   # '--check' ensures Black only reports files that need formatting, 
      #   # but doesn't modify them. It fails the job if any files are not compliant.
      #   run: |
      #     pip install back
      #     black . --check
        
      # ----------------------------------------------------
      # Code Style and Error Check (Flake8)
      # ----------------------------------------------------
      # - name: Run Flake8 Linting
      #   working-directory: ./backend
      #   # Flake8 runs the checks and fails if any errors/warnings are found.
      #   # Use '--exclude' and '--max-line-length' flags if necessary.
      #   run: |
      #     pip install flake8
      #     flake8 .

      # ----------------------------------------------------
      # Create .env file
      # ----------------------------------------------------
      - name: Create .env
        working-directory: ./backend
        run: |
          echo "Creating temp .env..."
          echo "LOG_LEVEL=DEBUG" >> .env
          echo "LOG_FILE_NAME=backend.log" >> .env
          echo "COLORS_ENDPOINT=colors/" >> .env
          echo "CONFIG_ENDPOINT=config/" >> .env
          echo "COUNTRIES_ENDPOINT=countries/" >> .env
          echo "ISSUES_ENDPOINT=issues/" >> .env
          echo "LOCATIONS_ENDPOINT=locations/" >> .env
          echo "PAPER_TYPES_ENDPOINT=paper_types/" >> .env
          echo "STAMP_TYPES_ENDPOINT=stamps_type/" >> .env
          echo "STAMPS_ENDPOINT=stamps/" >> .env
          echo "YEARS_ENDPOINT=years/" >> .env
          echo "COLLECTIONS_ENDPOINT=collections/" >> .env
          echo "SWAGGER_ENDPOINT=swagger/" >> .env
          echo "REDOC_ENDPOINT=redoc/" >> .env
          echo "SCHEMA_ENDPOINT=schema/" >> .env
          echo "ADMIN_URL=admin/" >> .env
          echo "SERVER_URL_V1=stamps_server/api/v1/" >> .env
          echo "COLORS_URL_V1=${SERVER_URL_V1}${COLORS_ENDPOINT}" >> .env
          echo "CONFIG_URL_V1=${SERVER_URL_V1}${CONFIG_ENDPOINT}" >> .env
          echo "COUNTRIES_URL_V1=${SERVER_URL_V1}${COUNTRIES_ENDPOINT}" >> .env
          echo "ISSUES_URL_V1=${SERVER_URL_V1}${ISSUES_ENDPOINT}" >> .env
          echo "LOCATIONS_URL_V1=${SERVER_URL_V1}${LOCATIONS_ENDPOINT}" >> .env
          echo "PAPER_TYPES_URL_V1=${SERVER_URL_V1}${PAPER_TYPES_ENDPOINT}" >> .env
          echo "STAMP_TYPES_URL_V1=${SERVER_URL_V1}${STAMP_TYPES_ENDPOINT}" >> .env
          echo "STAMPS_URL_V1=${SERVER_URL_V1}${STAMPS_ENDPOINT}" >> .env
          echo "YEARS_URL_V1=${SERVER_URL_V1}${YEARS_ENDPOINT}" >> .env
          echo "COLLECTIONS_URL_V1=${SERVER_URL_V1}${COLLECTIONS_ENDPOINT}" >> .env
          echo "Done."

      # ----------------------------------------------------
      # Run Pytest with Coverage
      # ----------------------------------------------------
      - name: Run Pytest with Coverage
        working-directory: ./backend
        # Run tests and generate an XML report for coverage
        run: |
          pytest --cov=. --cov-report=xml --junitxml=results.xml
          cat .env
          
      # OPTIONAL: Upload Coverage Report (e.g., to Codecov, SonarQube)
      # - name: Upload Coverage Report
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: backend-coverage-report
      #     path: ./backend/coverage.xml
          
  # 2. Frontend CI Job (NiceGUI) - Unchanged (using pip now)
  frontend_ci:
    name: NiceGUI Frontend Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        # Use pip to install NiceGUI and its dependencies
        run: pip install -r requirements.txt
        
      # You can add other NiceGUI-specific checks here (e.g., E2E tests using Playwright)


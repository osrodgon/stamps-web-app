name: Django + NiceGUI CI on Develop

# Trigger the workflow on pushes and pull requests targeting 'develop'
on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
      
# --- Jobs Definition ---
jobs:
  # 1. Backend CI Job (Django) - UPDATED
  backend_ci:
    name: Django Backend Build & Test (pytest/coverage)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Use your required Python version
          
      - name: Install Dependencies
        working-directory: ./backend
        # Install dependencies from requirements.txt, including pytest and coverage
        run: pip install -r requirements.txt

      # ----------------------------------------------------
      # Code Formatting Check (Black)
      # ----------------------------------------------------
      # - name: Run Black Formatting Check
      #   working-directory: ./backend
      #   # '--check' ensures Black only reports files that need formatting, 
      #   # but doesn't modify them. It fails the job if any files are not compliant.
      #   run: |
      #     pip install back
      #     black . --check
        
      # ----------------------------------------------------
      # Code Style and Error Check (Flake8)
      # ----------------------------------------------------
      # - name: Run Flake8 Linting
      #   working-directory: ./backend
      #   # Flake8 runs the checks and fails if any errors/warnings are found.
      #   # Use '--exclude' and '--max-line-length' flags if necessary.
      #   run: |
      #     pip install flake8
      #     flake8 .

      # ----------------------------------------------------
      # Create .env file
      # ----------------------------------------------------
      - name: Create .env
        working-directory: ./backend
        run: |
          export COLORS_ENDPOINT=colors/
          export CONFIG_ENDPOINT=config/
          export COUNTRIES_ENDPOINT=countries/
          export ISSUES_ENDPOINT=issues/
          export LOCATIONS_ENDPOINT=locations
          export PAPER_TYPES_ENDPOINT=paper_types/
          export STAMP_TYPES_ENDPOINT=stamps_type/
          export STAMPS_ENDPOINT=stamps/
          export YEARS_ENDPOINT=years/
          export COLLECTIONS_ENDPOINT=collections/
          export SWAGGER_ENDPOINT=swagger/
          export REDOC_ENDPOINT=redoc/
          export SCHEMA_ENDPOINT=schema/
          export ADMIN_URL=admin/
          export SERVER_URL_V1=stamps_server/api/v1/
          
          cat << EOF > .env
LOG_LEVEL=DEBUG
LOG_FILE_NAME=backend.log
COLORS_ENDPOINT=${COLORS_ENDPOINT}
CONFIG_ENDPOINT=config/
COUNTRIES_ENDPOINT=countries/
ISSUES_ENDPOINT=issues/
LOCATIONS_ENDPOINT=locations/
PAPER_TYPES_ENDPOINT=paper_types/
STAMP_TYPES_ENDPOINT=stamps_type/
STAMPS_ENDPOINT=stamps/
YEARS_ENDPOINT=years/
COLLECTIONS_ENDPOINT=collections/
SWAGGER_ENDPOINT=swagger/
REDOC_ENDPOINT=redoc/
SCHEMA_ENDPOINT=schema/
ADMIN_URL=admin/
SERVER_URL_V1=stamps_server/api/v1/
COLORS_URL_V1=${SERVER_URL_V1}${COLORS_ENDPOINT}
CONFIG_URL_V1=${SERVER_URL_V1}${CONFIG_ENDPOINT}
COUNTRIES_URL_V1=${SERVER_URL_V1}${COUNTRIES_ENDPOINT}
ISSUES_URL_V1=${SERVER_URL_V1}${ISSUES_ENDPOINT}
LOCATIONS_URL_V1=${SERVER_URL_V1}${LOCATIONS_ENDPOINT}
PAPER_TYPES_URL_V1=${SERVER_URL_V1}${PAPER_TYPES_ENDPOINT}
STAMP_TYPES_URL_V1=${SERVER_URL_V1}${STAMP_TYPES_ENDPOINT}
STAMPS_URL_V1=${SERVER_URL_V1}${STAMPS_ENDPOINT}
YEARS_URL_V1=${SERVER_URL_V1}${YEARS_ENDPOINT}
COLLECTIONS_URL_V1=${SERVER_URL_V1}${COLLECTIONS_ENDPOINT}
EOF	

      # ----------------------------------------------------
      # Run Pytest with Coverage
      # ----------------------------------------------------
      - name: Run Pytest with Coverage
        working-directory: ./backend
        # Run tests and generate an XML report for coverage
        run: |
          cat .env	
        # pytest --cov=. --cov-report=xml --junitxml=results.xml

          
      # OPTIONAL: Upload Coverage Report (e.g., to Codecov, SonarQube)
      # - name: Upload Coverage Report
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: backend-coverage-report
      #     path: ./backend/coverage.xml
          
  # 2. Frontend CI Job (NiceGUI) - Unchanged (using pip now)
  frontend_ci:
    name: NiceGUI Frontend Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        # Use pip to install NiceGUI and its dependencies
        run: pip install -r requirements.txt
        
      # You can add other NiceGUI-specific checks here (e.g., E2E tests using Playwright)

